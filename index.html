<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按领域、品类和研究方向检索调研报告与交互工具。">
  <title>Research Hub · 调研知识库</title>
  <link rel="stylesheet" href="assets/hub.css">
  <script src="assets/hub.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="brand" href="./" aria-label="调研知识库首页">Research Hub</a>
      <a class="source-link" href="https://github.com/JessPinkmam/Qingyuanshan">GitHub 仓库 ↗</a>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">调研知识库</h1>
        <p>从领域到品类，再到具体研究方向，找到下一份需要的报告。</p>
      </section>
      <form id="search-form" class="filters" aria-label="搜索与筛选报告">
        <fieldset id="filter-fields" disabled>
          <legend class="sr-only">报告筛选条件</legend>
          <div class="search-field">
            <label for="search">搜索报告</label>
            <input id="search" type="search" placeholder="标题、内容或标签，例如喷泉、利润、租房" autocomplete="off">
          </div>
          <div class="filter-row">
            <div>
              <label for="domain">大领域</label>
              <select id="domain"><option value="">全部领域</option></select>
            </div>
            <div>
              <label for="category">品类 / 管理分类</label>
              <select id="category"><option value="">全部分类</option></select>
            </div>
            <div>
              <label for="topic">研究方向</label>
              <select id="topic"><option value="">全部方向</option></select>
            </div>
            <button id="clear-filters" class="clear-button" type="button">清空筛选</button>
          </div>
        </fieldset>
      </form>
      <div class="results-header">
        <h2>报告目录</h2>
        <output id="result-count" aria-live="polite">正在读取目录…</output>
      </div>
      <div id="load-error" class="notice" role="alert" hidden>
        <p>目录读取失败，请重试。</p>
        <button id="retry" class="clear-button" type="button">重新加载</button>
      </div>
      <p id="empty-state" class="notice" hidden>没有符合条件的报告，请调整关键词或清空筛选。</p>
      <section id="reports" class="report-grid" aria-label="报告列表"></section>
    </main>
    <footer>
      <a href="https://github.com/JessPinkmam/Qingyuanshan/blob/main/README.md">分类说明与归档约定</a>
      <a href="reports.json">结构化索引</a>
    </footer>
  </div>
</body>
</html>
